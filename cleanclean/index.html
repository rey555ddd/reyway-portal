<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淨淨 CleanClean · 工具總覽</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080808;
  --surface:#111111;
  --text:#FFFFFF;
  --text-2:rgba(255,255,255,0.45);
  --text-3:rgba(255,255,255,0.28);
  --accent:#C9A96A;
  --accent-deep:#E8C87A;
  --accent-soft:rgba(201,169,106,0.10);
  --accent-edge:rgba(201,169,106,0.25);
  --border:rgba(201,169,106,0.13);
  --border-warm:rgba(201,169,106,0.22);
  --shadow:0 1px 2px rgba(0,0,0,0.4),0 6px 18px rgba(0,0,0,0.3);
  --shadow-hover:0 12px 30px rgba(201,169,106,0.15),0 2px 6px rgba(0,0,0,0.4);
  --radius:14px;
  --font-ui:'Inter','Noto Sans TC',-apple-system,sans-serif;
  --font-serif:'Noto Serif TC',serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:700px;margin:0 auto;padding:0 20px 60px}

/* ── 頂欄 ── */
.topbar{
  display:flex;align-items:center;
  padding:20px 0 0;
  margin-bottom:32px;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border-warm);
  color:var(--text-2);font-size:0.82rem;font-weight:500;
  text-decoration:none;
  transition:all 0.2s ease;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.back-btn .ph{font-size:0.95rem}

/* ── Hero ── */
.hero{text-align:center;padding:8px 0 36px}
.hero-logo{
  display:inline-block;
  background:#fff;
  border-radius:16px;
  padding:10px 20px;
  margin-bottom:20px;
  border:1px solid var(--border-warm);
  box-shadow:var(--shadow);
}
.hero-logo img{
  height:52px;
  width:auto;
  display:block;
}
.hero p{font-size:0.9rem;color:var(--text-2);line-height:1.75;max-width:340px;margin:0 auto}
.gold-line{width:36px;height:2px;background:var(--accent);margin:14px auto 0;border-radius:2px}

/* ── Section 標頭 ── */
.section-head{display:flex;align-items:center;gap:10px;margin:32px 0 14px}
.section-label{font-size:0.68rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.section-line{flex:1;height:1px;background:var(--border)}

/* ── 主要大卡（寬版）── */
.wide-card{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;
  background:var(--surface);border:1px solid var(--accent-edge);border-radius:var(--radius);
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
  transition:all 0.28s cubic-bezier(0.16,1,0.3,1);
  margin-bottom:12px;
}
.wide-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.wide-card:hover .wc-icon{background:var(--accent);color:#fff}
.wc-icon{
  width:44px;height:44px;border-radius:11px;flex-shrink:0;
  background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all 0.28s ease;
}
.wc-icon .ph{font-size:1.4rem}
.wc-body{flex:1}
.wc-body h3{font-family:var(--font-serif);font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:3px}
.wc-body p{font-size:0.8rem;color:var(--text-2);line-height:1.55}
.wc-arrow{font-size:1rem;color:var(--accent);flex-shrink:0}

/* ── 工具小卡 2×2 ── */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(max-width:460px){.tool-grid{grid-template-columns:1fr}}

.tool-card{
  display:flex;align-items:flex-start;gap:13px;
  padding:16px 16px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
  transition:all 0.28s cubic-bezier(0.16,1,0.3,1);
}
.tool-card:hover{border-color:var(--accent-edge);transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.tool-card:hover .tc-icon{background:var(--accent);color:#fff}
.tc-icon{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;margin-top:1px;
  background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all 0.28s ease;
}
.tc-icon .ph{font-size:1.2rem;line-height:1}
.tc-body{flex:1;min-width:0}
.tc-name{font-family:var(--font-serif);font-size:0.98rem;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.tc-desc{font-size:0.76rem;color:var(--text-2);line-height:1.6}
.tc-badge{
  display:inline-block;font-size:0.63rem;font-weight:500;
  padding:2px 7px;border-radius:100px;margin-top:6px;
  background:rgba(34,197,94,0.1);color:#22c55e;
  letter-spacing:0.04em;
}
.tc-badge::before{content:'● ';font-size:0.5em;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back-btn" href="https://reyway.com">
      <i class="ph ph-arrow-left"></i> 返回總站
    </a>
  </div>

  <div class="hero">
    <div class="hero-logo">
      <img src="/logo-cleanclean.png" alt="淨淨 CleanClean">
    </div>
    <p>品牌旗下所有 AI 工具與管理系統</p>
    <div class="gold-line"></div>
  </div>

  <!-- 品牌官網 -->
  <div class="section-head">
    <span class="section-label">品牌官網</span>
    <div class="section-line"></div>
  </div>
  <a class="wide-card" href="https://cleanclean.tw" target="_blank" rel="noopener">
    <div class="wc-icon"><i class="ph ph-storefront"></i></div>
    <div class="wc-body">
      <h3>淨淨官網</h3>
      <p>消費者入口・家用清潔・個人護理・代言人李仁哥・SGS 認證</p>
    </div>
    <div class="wc-arrow"><i class="ph ph-arrow-up-right"></i></div>
  </a>

  <!-- 行銷工具 -->
  <div class="section-head">
    <span class="section-label">行銷工具</span>
    <div class="section-line"></div>
  </div>
  <div class="tool-grid">
    <a class="tool-card" href="https://cchub.reyway.com" target="_blank" rel="noopener">
      <div class="tc-icon"><i class="ph ph-megaphone"></i></div>
      <div class="tc-body">
        <div class="tc-name">行銷神隊友</div>
        <div class="tc-desc">文案庫・KOL 雷達・社群企劃・短影音腳本</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
    <a class="tool-card" href="https://design.reyway.com" target="_blank" rel="noopener">
      <div class="tc-icon"><i class="ph ph-paint-brush"></i></div>
      <div class="tc-body">
        <div class="tc-name">美學工作站</div>
        <div class="tc-desc">廣告圖生成・素材合版・AI 圖命名・品牌規範</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
    <a class="tool-card" href="https://boardroom.reyway.com" target="_blank" rel="noopener">
      <div class="tc-icon"><i class="ph ph-users-three"></i></div>
      <div class="tc-body">
        <div class="tc-name">AI 董事會室</div>
        <div class="tc-desc">12 位 AI 顧問・策略腦力激盪・多模式分析</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
    <a class="tool-card" href="/knowledge/" rel="noopener">
      <div class="tc-icon"><i class="ph ph-books"></i></div>
      <div class="tc-body">
        <div class="tc-name">淨淨知識庫</div>
        <div class="tc-desc">品牌教學・報告分析・工具手冊・內部資料</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
  </div>

  <!-- 電商與數據 -->
  <div class="section-head">
    <span class="section-label">電商與管理</span>
    <div class="section-line"></div>
  </div>
  <div class="tool-grid">
    <a class="tool-card" href="https://ec.reyway.com" target="_blank" rel="noopener">
      <div class="tc-icon"><i class="ph ph-chart-line-up"></i></div>
      <div class="tc-body">
        <div class="tc-name">電商後台</div>
        <div class="tc-desc">銷售數據・業績追蹤・電商活動管理</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
    <a class="tool-card" href="https://cleanclean-hub.pages.dev" target="_blank" rel="noopener">
      <div class="tc-icon"><i class="ph ph-buildings"></i></div>
      <div class="tc-body">
        <div class="tc-name">營銷總站</div>
        <div class="tc-desc">公告・會議・頻道・員工・業績整合系統</div>
        <span class="tc-badge">上線</span>
      </div>
    </a>
  </div>

</div>
</body>
</html>
